[package]
name = "cult-backend-v2"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4.0"  
actix-service = "2.0.3"
futures = "0.3.31"
actix-web-actors = "4.2.0" 
actix = "0.13.1" 
serde = { version = "1.0.193", features = ["derive"] } 
serde_json = "1.0"
sqlx = { version = "0.8.3", features = ["runtime-tokio-native-tls", "postgres", "chrono","bigdecimal"] } 
tokio = { version = "1.32.0", features = ["full","rt-multi-thread"] } 
tokio-postgres = "0.7"
env_logger = "0.11.7" 
log = "0.4.20" 
dotenv = "0.15"  
actix-multipart = "0.7.2"
thiserror = "2.0.9"
image = "0.25.5"
chrono = { version = "0.4.39", features = ["serde"] }
alloy = { version = "0.12.5", features = ["full"] }
alloy-merkle-tree = "0.7.2"
anyhow = "1.0"
reqwest = { version = "0.12.15", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1.3", features = ["v4", "serde"] }
hex = "0.4"
bytes = "1.5"
rand = "0.9.0"
ordered-float = "5.0.0"
regex = "1.10.3"
bigdecimal = { version = "0.4", features = ["serde"] }
utoipa = "5.3.1"              # check for the latest version
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }    # optional, for a Swagger UI
num-traits = "0.2"
actix-cors = "0.7.1"
sentry = { version = "0.38.1", features = ["anyhow", "log", "panic", "tracing"] }
sentry-actix = "0.38.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lazy_static = "1.4"
tokio-cron-scheduler = "0.14.0"

alloy-primitives = "1.0.0"
alloy-provider = "0.12.5"
alloy-rpc-client = "0.12.5"
alloy-transport-http = "0.12.5"
alloy-signer = "0.12.5"
alloy-contract = "0.12.5"
alloy-json-abi = "1.0.0"
alloy-network = "0.12.5"
alloy-consensus = "0.12.5"
alloy-genesis = "0.12.5"
alloy-rpc-types = "0.12.5"
csv = "1.3.0"
openssl = { version = "0.10", features = ["vendored"] }


[build-dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[[bin]]
name = "cult-backend-v2"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

